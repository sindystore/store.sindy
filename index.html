<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PWA / Add to Home Screen Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SNI Sindy">
    <link rel="apple-touch-icon" href="https://s.imgz.io/2026/07/15/DA0D2171-669F-4863-B0AD-A3084C2E881A787a7e4aae484696.png">

    <title>SNI Sindy Premium</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #fafafa; }
        ::-webkit-scrollbar { display: none; } /* ซ่อน scrollbar */

        /* กรอบเลเซอร์ขาวดำขยับได้ */
        .laser-border {
            position: relative;
            background: #fff;
            border-radius: 1rem;
            z-index: 1;
        }
        .laser-border::before {
            content: ""; position: absolute; inset: -3px;
            border-radius: 1.1rem;
            background: linear-gradient(45deg, #000000, #e0e0e0, #000000, #e0e0e0);
            background-size: 300%;
            z-index: -1;
            animation: laser 3s linear infinite;
        }
        @keyframes laser {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        /* แก้อาการกดยากในมือถือ */
        button { touch-action: manipulation; }

        /* ซ่อนหน้าต่าง Pop up ตอนเริ่ม */
        .modal { display: none; }
        .modal.active { display: flex; }

        .product-thumb {
            width: 100%; height: 140px; object-fit: cover; border-radius: 0.75rem;
            margin-bottom: 0.75rem; background: #f3f4f6;
        }
        .admin-tab {
            padding: 0.4rem 0.9rem; border-radius: 0.6rem; font-size: 0.9rem; cursor: pointer;
        }
        .admin-tab.active { background: #000; color: #fff; }
        .admin-tab:not(.active) { background: #f3f4f6; color: #374151; }
    </style>
</head>
<body class="text-gray-900 antialiased selection:bg-black selection:text-white pb-24">

    <!-- Navbar -->
    <nav class="fixed top-0 w-full bg-white/90 backdrop-blur-md border-b border-gray-200 z-40 px-4 py-3 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <img src="https://s.imgz.io/2026/07/15/DA0D2171-669F-4863-B0AD-A3084C2E881A787a7e4aae484696.png" class="w-10 h-10 rounded-full border border-black" alt="Logo">
            <span class="font-semibold text-lg">SNI Sindy</span>
        </div>
        <div class="flex gap-4 items-center">
            <button onclick="openAdmin()" class="text-gray-400 hover:text-black transition"><i class="ph ph-lock-key text-2xl"></i></button>
            <button onclick="toggleCart()" class="relative text-black">
                <i class="ph ph-shopping-cart text-2xl"></i>
                <span id="cartBadge" class="absolute -top-2 -right-2 bg-black text-white text-xs w-5 h-5 flex items-center justify-center rounded-full hidden">0</span>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="pt-24 px-4 max-w-4xl mx-auto">
        <div id="loading" class="text-center py-20 flex flex-col items-center">
            <i class="ph ph-spinner-gap animate-spin text-4xl mb-3"></i>
            <p class="text-sm">กำลังโหลดข้อมูลร้านค้า...</p>
        </div>
        <div id="loadError" class="text-center py-16 hidden">
            <i class="ph ph-warning-circle text-4xl text-red-500 mb-3"></i>
            <p class="text-sm text-gray-600 mb-4" id="loadErrorMsg">โหลดข้อมูลไม่สำเร็จ</p>
            <button onclick="fetchData()" class="px-4 py-2 bg-black text-white rounded-xl text-sm">ลองใหม่อีกครั้ง</button>
        </div>

        <div id="productGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Products will be injected here -->
        </div>
    </main>

    <!-- Cart Modal -->
    <div id="cartModal" class="modal fixed inset-0 bg-black/50 z-50 justify-end">
        <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col transform translate-x-full transition-transform duration-300" id="cartPanel">
            <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                <h2 class="text-xl font-semibold flex items-center gap-2"><i class="ph ph-bag"></i> ตะกร้าสินค้า</h2>
                <button onclick="toggleCart()" class="text-xl p-2"><i class="ph ph-x"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-4" id="cartItems">
                <!-- Cart Items -->
            </div>
            <div class="p-4 border-t border-gray-200 bg-white">
                <div class="flex justify-between text-lg font-semibold mb-4">
                    <span>ยอดรวม:</span>
                    <span id="cartTotal">0 บาท</span>
                </div>
                <button onclick="openCheckout()" id="checkoutBtn" class="w-full bg-black text-white py-3 rounded-xl font-medium hover:bg-gray-800 transition disabled:opacity-50">
                    ยืนยันคำสั่งซื้อ
                </button>
            </div>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="modal fixed inset-0 bg-black/60 z-50 items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal('checkoutModal')" class="absolute top-4 right-4 text-gray-400 hover:text-black"><i class="ph ph-x text-xl"></i></button>
            <h2 class="text-xl font-semibold text-center mb-4">ชำระเงิน</h2>

            <div class="bg-gray-100 p-4 rounded-2xl flex flex-col items-center mb-4 text-center">
                <img src="https://s.imgz.io/2026/07/15/IMG_75242612165b6fd16c31.jpeg" class="w-48 rounded-xl shadow-sm mb-3" alt="QR Code">
                <p class="text-sm font-medium">ร้านค้าออมสินมหาเฮง (คิงแอดส์)</p>
                <p class="text-lg font-bold mt-2">ยอดโอน: <span id="checkoutTotalAmount">0</span> บาท</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm mb-1 text-gray-600">อีเมลสำหรับรับสินค้า</label>
                    <input type="email" id="customerEmail" class="w-full border border-gray-300 p-3 rounded-xl focus:outline-none focus:border-black" placeholder="example@mail.com">
                </div>

                <div>
                    <label class="block text-sm mb-1 text-gray-600">แนบสลิป (คลิกหรือลากวาง)</label>
                    <div class="border-2 border-dashed border-gray-300 rounded-xl p-4 text-center cursor-pointer hover:bg-gray-50 transition relative overflow-hidden" id="dropZone" onclick="document.getElementById('slipInput').click()">
                        <i class="ph ph-image text-3xl text-gray-400 mb-2"></i>
                        <p class="text-sm text-gray-500" id="slipName">ยังไม่ได้เลือกรูปภาพ</p>
                        <input type="file" id="slipInput" class="hidden" accept="image/*" onchange="handleSlipSelect(event)">
                        <img id="slipPreview" class="absolute inset-0 w-full h-full object-cover hidden">
                    </div>
                </div>

                <button onclick="submitOrder(this)" class="w-full bg-black text-white py-3 rounded-xl font-medium hover:bg-gray-800 transition flex justify-center items-center gap-2">
                    <i class="ph ph-paper-plane-right"></i> แจ้งโอนเงิน
                </button>
                <p id="checkoutMsg" class="text-sm text-center text-red-500 hidden"></p>
            </div>
        </div>
    </div>

    <!-- Receipt Modal -->
    <div id="receiptModal" class="modal fixed inset-0 bg-black/60 z-50 items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-xl text-center flex flex-col items-center">
            <h2 class="text-2xl font-bold mb-2">สั่งซื้อสำเร็จ! 🎉</h2>
            <p class="text-sm text-gray-500 mb-6">ระบบได้จัดส่งข้อมูลไปที่อีเมลของคุณแล้ว</p>

            <!-- Receipt Card for Download -->
            <div id="receiptCard" class="bg-gray-50 border border-gray-200 w-full rounded-2xl p-5 mb-6 text-left relative overflow-hidden shadow-inner">
                <div class="absolute -top-4 -right-4 opacity-10"><i class="ph ph-check-circle text-6xl"></i></div>
                <div class="flex items-center gap-3 mb-4 pb-4 border-b border-dashed border-gray-300">
                    <img src="https://s.imgz.io/2026/07/15/DA0D2171-669F-4863-B0AD-A3084C2E881A787a7e4aae484696.png" class="w-10 h-10 rounded-full" alt="Logo" crossorigin="anonymous">
                    <div>
                        <p class="font-bold leading-tight">SNI Sindy</p>
                        <p class="text-xs text-gray-500" id="receiptDate">12/05/2026</p>
                    </div>
                </div>
                <p class="text-xs text-gray-400 mb-2" id="receiptOrderId"></p>
                <div id="receiptItems" class="space-y-2 text-sm mb-4">
                    <!-- Items -->
                </div>
                <div class="pt-4 border-t border-dashed border-gray-300 flex justify-between font-bold">
                    <span>ยอดสุทธิ</span>
                    <span id="receiptTotal">0 ฿</span>
                </div>
            </div>

            <button onclick="downloadReceipt()" class="w-full border-2 border-black text-black py-3 rounded-xl font-medium hover:bg-black hover:text-white transition flex justify-center items-center gap-2 mb-3">
                <i class="ph ph-download-simple"></i> บันทึกใบเสร็จ
            </button>
            <button onclick="closeModal('receiptModal'); location.reload();" class="text-gray-500 text-sm hover:text-black underline">ปิดหน้าต่าง</button>
        </div>
    </div>

    <!-- Info/Welcome Popup -->
    <div id="infoPopup" class="modal fixed inset-0 bg-black/60 z-[60] items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-xl text-center">
            <img id="popupImg" src="" class="w-full rounded-xl mb-4 hidden" alt="Promo">
            <p id="popupText" class="text-gray-800 mb-6 whitespace-pre-line"></p>
            <button onclick="closeModal('infoPopup')" class="w-full bg-black text-white py-3 rounded-xl font-medium hover:bg-gray-800 transition">
                รับทราบ
            </button>
        </div>
    </div>

    <!-- Admin Modal -->
    <div id="adminModal" class="modal fixed inset-0 bg-white z-[70] flex-col h-full w-full">
        <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
            <h2 class="text-xl font-semibold"><i class="ph ph-gear"></i> จัดการหลังบ้าน</h2>
            <button onclick="closeModal('adminModal')" class="text-xl p-2"><i class="ph ph-x"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto p-4" id="adminContent">
            <!-- JS will render admin panel here -->
        </div>
    </div>


    <script>
        // ================= CONFIG =================
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyQweZu2ig2Rx6CMd6FumI389F951ZXLOHX_d7Myihz46ZE31TnqUjd6SMPAutDsNWTzA/exec'; // <<<<<<< เปลี่ยนเป็น Web App URL ของคุณ (Deploy > Web app > URL)
        // PIN นี้เป็นแค่ด่านกันคนทั่วไปเปิดหน้าแอดมินเล่นเฉยๆ ตัวระบบจริงยังตรวจ PIN ซ้ำที่ฝั่ง Apps Script (server) ทุกครั้งอยู่แล้ว
        const ADMIN_PIN = '0000s';

        // ================= STATE =================
        let products = [];       // ข้อมูลสาธารณะ (หน้าร้าน) - มีแค่ตัวเลข stock
        let adminProducts = [];  // ข้อมูลเต็มสำหรับแอดมิน (มี stockData ดิบ)
        let cart = [];
        let settings = {};
        let slipBase64 = null;
        let currentAdminTab = 'products';

        // ================= UTIL =================
        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
        function toNum(v) {
            const n = Number(v);
            return isNaN(n) ? 0 : n;
        }

        // ================= INIT =================
        window.onload = () => {
            checkInAppBrowser();
            generateManifest();
            fetchData();
        };

        function generateManifest() {
            const manifest = {
                "name": "SNI Sindy",
                "short_name": "Sindy",
                "start_url": ".",
                "display": "standalone",
                "background_color": "#ffffff",
                "theme_color": "#ffffff",
                "icons": [{ "src": "https://s.imgz.io/2026/07/15/DA0D2171-669F-4863-B0AD-A3084C2E881A787a7e4aae484696.png", "sizes": "512x512", "type": "image/png" }]
            };
            const stringManifest = JSON.stringify(manifest);
            const blob = new Blob([stringManifest], {type: 'application/json'});
            const manifestURL = URL.createObjectURL(blob);
            document.querySelector('head').insertAdjacentHTML('beforeend', `<link rel="manifest" href="${manifestURL}">`);
        }

        function checkInAppBrowser() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            if (ua.indexOf('FBAN') > -1 || ua.indexOf('FBAV') > -1 || ua.indexOf('Line') > -1 || ua.indexOf('Instagram') > -1) {
                alert('⚠️ กรุณาเปิดเว็บใน Safari หรือ Chrome เพื่อการทำงานที่สมบูรณ์ (กด ... มุมขวาบนแล้วเลือกเปิดในเบราว์เซอร์)');
            }
        }

        // เรียก API กลาง ใช้ text/plain เพื่อเลี่ยง CORS preflight (Apps Script ไม่รองรับ OPTIONS)
        async function callApi(payload) {
            const res = await fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            const json = await res.json();
            if (json.status !== 'success') throw new Error(json.message || 'เกิดข้อผิดพลาดไม่ทราบสาเหตุ');
            return json.data;
        }

        async function fetchData() {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('loadError').classList.add('hidden');
            document.getElementById('productGrid').classList.add('hidden');
            try {
                const data = await callApi({ action: 'init' });
                products = data.products || [];
                settings = data.settings || {};
                renderProducts();
                showWelcomePopup();
                document.getElementById('productGrid').classList.remove('hidden');
            } catch (err) {
                console.error(err);
                document.getElementById('loadErrorMsg').textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + err.message;
                document.getElementById('loadError').classList.remove('hidden');
            }
            document.getElementById('loading').classList.add('hidden');
        }

        // ================= UI RENDERING =================
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            if (products.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-400 py-10">ยังไม่มีสินค้าในระบบ</p>`;
                return;
            }

            products.forEach(p => {
                const stock = toNum(p.stock);
                const stockLabel = stock > 0
                    ? `<span class="text-xs bg-gray-100 px-2 py-1 rounded-md">เหลือ ${stock}</span>`
                    : `<span class="text-xs bg-red-100 text-red-600 px-2 py-1 rounded-md">สินค้าหมด</span>`;
                const thumb = p.imageUrl
                    ? `<img src="${escapeHtml(p.imageUrl)}" class="product-thumb" alt="${escapeHtml(p.name)}">`
                    : '';

                grid.innerHTML += `
                <div class="laser-border">
                    <div class="bg-white rounded-2xl p-5 h-full flex flex-col justify-between">
                        <div>
                            ${thumb}
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="text-lg font-bold leading-tight">${escapeHtml(p.name)}</h3>
                                ${stockLabel}
                            </div>
                            <p class="text-sm text-gray-500 mb-2"><i class="ph ph-clock"></i> ระยะเวลา: ${escapeHtml(p.duration || '-')}</p>
                            <p class="text-xl font-bold mb-4">${toNum(p.price).toLocaleString()} ฿</p>
                            <details class="text-sm text-gray-600 mb-4 cursor-pointer group">
                                <summary class="font-medium outline-none">ดูรายละเอียดเพิ่มเติม</summary>
                                <div class="mt-2 pl-2 border-l-2 border-gray-200 whitespace-pre-line">${escapeHtml(p.details || '')}</div>
                            </details>
                        </div>
                        <button onclick="addToCart('${p.id}')" ${stock <= 0 ? 'disabled' : ''} class="w-full bg-black text-white py-3 rounded-xl font-medium hover:bg-gray-800 transition disabled:opacity-30 disabled:cursor-not-allowed flex justify-center items-center gap-2">
                            <i class="ph ph-shopping-cart-simple"></i> เพิ่มลงตะกร้า
                        </button>
                    </div>
                </div>`;
            });
        }

        // ================= CART SYSTEM =================
        function addToCart(id) {
            const product = products.find(p => p.id == id);
            if (!product || toNum(product.stock) <= 0) return;

            const existing = cart.find(item => item.id == id);
            if (existing) {
                if (existing.qty < toNum(product.stock)) existing.qty++;
                else alert('สินค้าหมดสต๊อกแล้ว!');
            } else {
                cart.push({ id: product.id, name: product.name, price: toNum(product.price), stock: toNum(product.stock), qty: 1 });
            }
            updateCartUI();

            // Animation effect
            const btn = document.querySelector(`button[onclick="addToCart('${id}')"]`);
            if (btn) {
                const ogText = btn.innerHTML;
                btn.innerHTML = `<i class="ph ph-check text-green-400"></i> เพิ่มแล้ว`;
                setTimeout(() => btn.innerHTML = ogText, 1000);
            }
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id != id);
            updateCartUI();
        }

        function updateCartUI() {
            const itemsContainer = document.getElementById('cartItems');
            const totalEl = document.getElementById('cartTotal');
            const badge = document.getElementById('cartBadge');
            const checkoutBtn = document.getElementById('checkoutBtn');

            itemsContainer.innerHTML = '';
            let total = 0;
            let count = 0;

            cart.forEach(item => {
                total += item.price * item.qty;
                count += item.qty;
                itemsContainer.innerHTML += `
                <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-gray-100 shadow-sm">
                    <div>
                        <p class="font-medium">${escapeHtml(item.name)}</p>
                        <p class="text-sm text-gray-500">${item.price.toLocaleString()} ฿ x ${item.qty}</p>
                    </div>
                    <button onclick="removeFromCart('${item.id}')" class="text-red-500 p-2 bg-red-50 rounded-lg hover:bg-red-100"><i class="ph ph-trash"></i></button>
                </div>`;
            });

            if (cart.length === 0) {
                itemsContainer.innerHTML = '<p class="text-center text-gray-400 py-10">ตะกร้าว่างเปล่า</p>';
                checkoutBtn.disabled = true;
            } else {
                checkoutBtn.disabled = false;
            }

            totalEl.innerText = `${total.toLocaleString()} บาท`;

            if (count > 0) {
                badge.innerText = count;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function toggleCart() {
            const modal = document.getElementById('cartModal');
            const panel = document.getElementById('cartPanel');
            if (modal.classList.contains('active')) {
                panel.classList.add('translate-x-full');
                setTimeout(() => modal.classList.remove('active'), 300);
            } else {
                modal.classList.add('active');
                setTimeout(() => panel.classList.remove('translate-x-full'), 10);
            }
        }

        // ================= CHECKOUT =================
        function openCheckout() {
            if (cart.length === 0) return;
            toggleCart(); // Close cart
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('checkoutTotalAmount').innerText = total.toLocaleString();

            // รีเซ็ตฟอร์ม
            document.getElementById('customerEmail').value = '';
            slipBase64 = null;
            document.getElementById('slipPreview').classList.add('hidden');
            document.getElementById('slipName').innerText = 'ยังไม่ได้เลือกรูปภาพ';
            document.getElementById('checkoutMsg').classList.add('hidden');

            document.getElementById('checkoutModal').classList.add('active');
        }

        // Drag & Drop Slip
        const dropZone = document.getElementById('dropZone');
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-black'); });
        dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.classList.remove('border-black'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-black');
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                processFile(e.dataTransfer.files[0]);
            }
        });

        function handleSlipSelect(e) {
            if (e.target.files && e.target.files[0]) processFile(e.target.files[0]);
        }

        function processFile(file) {
            if (!file.type.startsWith('image/')) { alert('กรุณาอัปโหลดไฟล์รูปภาพเท่านั้น'); return; }
            document.getElementById('slipName').innerText = file.name;
            const reader = new FileReader();
            reader.onload = (e) => {
                slipBase64 = e.target.result;
                const preview = document.getElementById('slipPreview');
                preview.src = slipBase64;
                preview.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        async function submitOrder(btn) {
            const msgEl = document.getElementById('checkoutMsg');
            msgEl.classList.add('hidden');

            const email = document.getElementById('customerEmail').value.trim();
            if (!email || !email.includes('@')) { alert('กรุณากรอกอีเมลให้ถูกต้อง'); return; }
            if (!slipBase64) { alert('กรุณาแนบสลิปโอนเงิน'); return; }
            if (cart.length === 0) { alert('ตะกร้าว่างเปล่า'); return; }

            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const payload = {
                action: 'checkout',
                email: email,
                cart: cart.map(item => ({ id: item.id, name: item.name, qty: item.qty })),
                total: total,
                slipBase64: slipBase64
            };

            // Loading state
            btn.disabled = true;
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class="ph ph-spinner-gap animate-spin"></i> กำลังดำเนินการ...`;

            try {
                const data = await callApi(payload);
                closeModal('checkoutModal');
                buildReceipt(data.orderId, total, cart);
                cart = [];
                updateCartUI();
                document.getElementById('receiptModal').classList.add('active');
                fetchData(); // รีเฟรชสต๊อกล่าสุดที่หน้าร้าน
            } catch (err) {
                msgEl.textContent = err.message;
                msgEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        // ================= RECEIPT =================
        function buildReceipt(orderId, total, items) {
            document.getElementById('receiptDate').innerText = new Date().toLocaleString('th-TH');
            document.getElementById('receiptOrderId').innerText = 'เลขคำสั่งซื้อ #' + orderId;
            const itemsContainer = document.getElementById('receiptItems');
            itemsContainer.innerHTML = '';
            items.forEach(item => {
                itemsContainer.innerHTML += `<div class="flex justify-between"><span>${item.qty}x ${escapeHtml(item.name)}</span><span>${(item.price * item.qty).toLocaleString()} ฿</span></div>`;
            });
            document.getElementById('receiptTotal').innerText = `${total.toLocaleString()} ฿`;
        }

        async function downloadReceipt() {
            const card = document.getElementById('receiptCard');
            try {
                const canvas = await html2canvas(card, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
                const link = document.createElement('a');
                link.download = `receipt_${new Date().getTime()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                alert('บันทึกรูปใบเสร็จไม่สำเร็จ ลองแคปหน้าจอแทนได้ครับ');
            }
        }

        // ================= POPUP =================
        function showWelcomePopup() {
            if (settings.popupText || settings.popupImageUrl) {
                if (settings.popupImageUrl) {
                    const img = document.getElementById('popupImg');
                    img.src = settings.popupImageUrl;
                    img.classList.remove('hidden');
                }
                document.getElementById('popupText').innerText = settings.popupText || '';
                document.getElementById('infoPopup').classList.add('active');
            }
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        // ================= ADMIN PANEL =================
        async function openAdmin() {
            const pin = prompt("กรุณากรอกรหัสผ่าน (PIN):");
            if (pin === null) return;
            if (pin !== ADMIN_PIN) return alert("รหัสผ่านไม่ถูกต้อง");

            document.getElementById('adminModal').classList.add('active');
            currentAdminTab = 'products';
            await loadAdminData();
        }

        async function loadAdminData() {
            const content = document.getElementById('adminContent');
            content.innerHTML = `<div class="text-center py-10"><i class="ph ph-spinner-gap animate-spin text-3xl"></i></div>`;
            try {
                const data = await callApi({ action: 'admin', pin: ADMIN_PIN, subAction: 'get_all' });
                adminProducts = data.products || [];
                settings = data.settings || settings;
                renderAdminPanel();
            } catch (err) {
                content.innerHTML = `<p class="text-center text-red-500 py-10">โหลดข้อมูลแอดมินไม่สำเร็จ: ${escapeHtml(err.message)}</p>`;
            }
        }

        function renderAdminPanel() {
            const content = document.getElementById('adminContent');
            content.innerHTML = `
                <div class="mb-6 flex gap-2 border-b border-gray-200 pb-3">
                    <button class="admin-tab ${currentAdminTab === 'products' ? 'active' : ''}" onclick="switchAdminTab('products')">จัดการสินค้า</button>
                    <button class="admin-tab ${currentAdminTab === 'settings' ? 'active' : ''}" onclick="switchAdminTab('settings')">ตั้งค่า Pop-up</button>
                </div>
                <div id="adminTabBody"></div>
            `;
            renderAdminTabBody();
        }

        function switchAdminTab(tab) {
            currentAdminTab = tab;
            renderAdminPanel();
        }

        function renderAdminTabBody() {
            const body = document.getElementById('adminTabBody');
            if (currentAdminTab === 'settings') {
                body.innerHTML = `
                    <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-3">
                        <h3 class="font-bold mb-1">ข้อความ Pop-up ต้อนรับ</h3>
                        <textarea id="adminPopupText" placeholder="ข้อความต้อนรับลูกค้า..." class="w-full p-2 rounded-lg border h-28">${escapeHtml(settings.popupText || '')}</textarea>
                        <label class="block text-sm text-gray-600">ลิงก์รูปภาพ Pop-up (ถ้ามี)</label>
                        <input type="text" id="adminPopupImage" placeholder="https://..." value="${escapeHtml(settings.popupImageUrl || '')}" class="w-full p-2 rounded-lg border">
                        <button onclick="saveAdminSettings(this)" class="w-full bg-black text-white py-2 rounded-lg hover:bg-gray-800">บันทึกการตั้งค่า</button>
                    </div>
                `;
                return;
            }

            body.innerHTML = `
                <div class="bg-gray-50 p-4 rounded-xl mb-6 border border-gray-200">
                    <h3 class="font-bold mb-3" id="adminFormTitle">เพิ่มสินค้าใหม่</h3>
                    <div class="space-y-3">
                        <input type="hidden" id="adminProdId">
                        <input type="text" id="adminName" placeholder="ชื่อสินค้า" class="w-full p-2 rounded-lg border">
                        <input type="text" id="adminImageUrl" placeholder="ลิงก์รูปภาพสินค้า (ไม่บังคับ)" class="w-full p-2 rounded-lg border">
                        <div class="flex gap-2">
                            <input type="text" id="adminDuration" placeholder="ระยะเวลา (เช่น 30 วัน)" class="w-1/2 p-2 rounded-lg border">
                            <input type="number" id="adminPrice" placeholder="ราคา (บาท)" class="w-1/2 p-2 rounded-lg border">
                        </div>
                        <textarea id="adminDetails" placeholder="รายละเอียดสินค้า..." class="w-full p-2 rounded-lg border h-20"></textarea>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">รายการสต๊อก (1 บัญชี/บรรทัด — ระบบจะตัดจากบนลงล่างให้อัตโนมัติเมื่อมีคำสั่งซื้อ)</label>
                            <textarea id="adminStockData" placeholder="user1@mail.com:pass1&#10;user2@mail.com:pass2" class="w-full p-2 rounded-lg border h-28 font-mono text-sm"></textarea>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="saveAdminProduct(this)" class="flex-1 bg-black text-white py-2 rounded-lg hover:bg-gray-800">บันทึกสินค้า</button>
                            <button onclick="resetAdminForm()" class="px-4 py-2 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-100">ล้างฟอร์ม</button>
                        </div>
                    </div>
                </div>

                <h3 class="font-bold mb-3">รายการสินค้าปัจจุบัน</h3>
                <div class="space-y-3" id="adminProductList"></div>
            `;
            updateAdminProductList();
        }

        function updateAdminProductList() {
            const list = document.getElementById('adminProductList');
            list.innerHTML = '';
            if (adminProducts.length === 0) {
                list.innerHTML = '<p class="text-center text-gray-400 py-6">ยังไม่มีสินค้า</p>';
                return;
            }
            adminProducts.forEach(p => {
                const stockStr = p.stockData ? p.stockData.toString() : '';
                const stockCount = stockStr.split('\n').filter(l => l.trim() !== '').length;
                list.innerHTML += `
                <div class="bg-white p-3 rounded-xl border border-gray-200 flex justify-between items-center">
                    <div>
                        <p class="font-medium">${escapeHtml(p.name)}</p>
                        <p class="text-sm text-gray-500">สต๊อก: ${stockCount} | ราคา: ${toNum(p.price).toLocaleString()} ฿</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="editProduct('${p.id}')" class="p-2 bg-gray-100 rounded-lg"><i class="ph ph-pencil-simple"></i></button>
                        <button onclick="deleteProduct('${p.id}', this)" class="p-2 bg-red-50 text-red-500 rounded-lg"><i class="ph ph-trash"></i></button>
                    </div>
                </div>`;
            });
        }

        function editProduct(id) {
            const p = adminProducts.find(x => x.id.toString() === id.toString());
            if (!p) return;
            document.getElementById('adminFormTitle').innerText = 'แก้ไขสินค้า: ' + p.name;
            document.getElementById('adminProdId').value = p.id;
            document.getElementById('adminName').value = p.name || '';
            document.getElementById('adminImageUrl').value = p.imageUrl || '';
            document.getElementById('adminDuration').value = p.duration || '';
            document.getElementById('adminPrice').value = p.price || '';
            document.getElementById('adminDetails').value = p.details || '';
            document.getElementById('adminStockData').value = p.stockData || '';
            window.scrollTo(0, 0);
        }

        function resetAdminForm() {
            document.getElementById('adminFormTitle').innerText = 'เพิ่มสินค้าใหม่';
            document.getElementById('adminProdId').value = '';
            document.getElementById('adminName').value = '';
            document.getElementById('adminImageUrl').value = '';
            document.getElementById('adminDuration').value = '';
            document.getElementById('adminPrice').value = '';
            document.getElementById('adminDetails').value = '';
            document.getElementById('adminStockData').value = '';
        }

        async function saveAdminProduct(btn) {
            const data = {
                id: document.getElementById('adminProdId').value,
                name: document.getElementById('adminName').value.trim(),
                imageUrl: document.getElementById('adminImageUrl').value.trim(),
                duration: document.getElementById('adminDuration').value.trim(),
                price: document.getElementById('adminPrice').value,
                details: document.getElementById('adminDetails').value.trim(),
                stockData: document.getElementById('adminStockData').value
            };
            if (!data.name || !data.price) return alert('กรอกชื่อสินค้าและราคาให้ครบ');

            const originalText = btn.innerHTML;
            btn.innerHTML = 'กำลังบันทึก...';
            btn.disabled = true;
            try {
                await callApi({ action: 'admin', pin: ADMIN_PIN, subAction: 'save_product', data: data });
                await loadAdminData();
                switchAdminTab('products');
                fetchData(); // อัปเดตหน้าร้านด้วย
            } catch (err) {
                alert('บันทึกไม่สำเร็จ: ' + err.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function deleteProduct(id, btn) {
            if (!confirm('ยืนยันการลบสินค้านี้?')) return;
            const originalText = btn.innerHTML;
            btn.innerHTML = '...';
            btn.disabled = true;
            try {
                await callApi({ action: 'admin', pin: ADMIN_PIN, subAction: 'delete_product', id: id });
                await loadAdminData();
                fetchData();
            } catch (err) {
                alert('ลบไม่สำเร็จ: ' + err.message);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function saveAdminSettings(btn) {
            const data = {
                popupText: document.getElementById('adminPopupText').value,
                popupImageUrl: document.getElementById('adminPopupImage').value.trim()
            };
            const originalText = btn.innerHTML;
            btn.innerHTML = 'กำลังบันทึก...';
            btn.disabled = true;
            try {
                await callApi({ action: 'admin', pin: ADMIN_PIN, subAction: 'save_settings', data: data });
                settings = data;
                alert('บันทึกการตั้งค่าเรียบร้อย');
            } catch (err) {
                alert('บันทึกไม่สำเร็จ: ' + err.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
